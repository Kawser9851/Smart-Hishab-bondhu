name: Build HisabBondhu APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/hisabbondhu/app/core
          mkdir -p app/src/main/java/com/hisabbondhu/app/data/local
          mkdir -p app/src/main/java/com/hisabbondhu/app/ui
          mkdir -p app/src/main/res/values

          # settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HisabBondhu"
          include(":app")
          EOF

          # root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
              id("org.jetbrains.kotlin.kapt") version "1.9.22" apply false
          }
          EOF

          # app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.kapt")
          }
          android {
              namespace = "com.hisabbondhu.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.hisabbondhu.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3:1.2.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
              val room = "2.6.1"
              implementation("androidx.room:room-runtime:$room")
              implementation("androidx.room:room-ktx:$room")
              kapt("androidx.room:room-compiler:$room")
          }
          EOF

          # Manifest
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="হিসাববন্ধু"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Database & Entities
          cat << 'EOF' > app/src/main/java/com/hisabbondhu/app/data/local/Entities.kt
          package com.hisabbondhu.app.data.local
          import androidx.room.*
          import java.math.BigDecimal

          enum class TransactionType { INCOME, EXPENSE }

          class Converters {
              @TypeConverter fun fromBigDecimal(v: BigDecimal?): String? = v?.toString()
              @TypeConverter fun toBigDecimal(v: String?): BigDecimal? = v?.let { BigDecimal(it) }
              @TypeConverter fun fromType(v: TransactionType): String = v.name
              @TypeConverter fun toType(v: String): TransactionType = TransactionType.valueOf(v)
          }

          @Entity(tableName = "transactions")
          data class TransactionEntity(
              @PrimaryKey val id: String,
              val title: String,
              val amount: BigDecimal,
              val type: TransactionType,
              val category: String,
              val date: Long = System.currentTimeMillis()
          )

          @Dao
          interface HisabDao {
              @Query("SELECT * FROM transactions ORDER BY date DESC")
              fun getAll(): kotlinx.coroutines.flow.Flow<List<TransactionEntity>>
              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun insert(t: TransactionEntity)
          }

          @Database(entities = [TransactionEntity::class], version = 1, exportSchema = false)
          @TypeConverters(Converters::class)
          abstract class AppDb : RoomDatabase() {
              abstract fun dao(): HisabDao
              companion object {
                  @Volatile private var I: AppDb? = null
                  fun get(c: android.content.Context): AppDb = I ?: synchronized(this) {
                      Room.databaseBuilder(c.applicationContext, AppDb::class.java, "hisab.db").build().also { I = it }
                  }
              }
          }
          EOF

          # MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/hisabbondhu/app/MainActivity.kt
          package com.hisabbondhu.app
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import androidx.lifecycle.viewmodel.compose.viewModel
          import com.hisabbondhu.app.data.local.*
          import kotlinx.coroutines.flow.*
          import kotlinx.coroutines.launch
          import java.math.BigDecimal
          import java.text.NumberFormat
          import java.util.Locale
          import java.util.UUID

          class MainViewModel(app: android.app.Application) : AndroidViewModel(app) {
              private val dao = AppDb.get(app).dao()
              val list = dao.getAll().stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())
              val income = list.map { it.filter { t -> t.type == TransactionType.INCOME }.sumOf { t -> t.amount } }
                  .stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), BigDecimal.ZERO)
              val expense = list.map { it.filter { t -> t.type == TransactionType.EXPENSE }.sumOf { t -> t.amount } }
                  .stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), BigDecimal.ZERO)

              fun add(title: String, amount: BigDecimal, type: TransactionType) {
                  viewModelScope.launch {
                      dao.insert(TransactionEntity(UUID.randomUUID().toString(), title, amount, type, "সাধারণ"))
                  }
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(colorScheme = lightColorScheme(primary = Color(0xFF00796B))) {
                          Screen()
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun Screen(vm: MainViewModel = viewModel()) {
              val list by vm.list.collectAsState()
              val inc by vm.income.collectAsState()
              val exp by vm.expense.collectAsState()
              var openDialog by remember { mutableStateOf(false) }

              Scaffold(
                  topBar = { TopAppBar(title = { Text("হিসাববন্ধু (অফলাইন)") }, colors = TopAppBarDefaults.topAppBarColors(containerColor = MaterialTheme.colorScheme.primary, titleContentColor = Color.White)) },
                  floatingActionButton = {
                      FloatingActionButton(onClick = { openDialog = true }, containerColor = MaterialTheme.colorScheme.primary, contentColor = Color.White) {
                          Text("+", fontSize = 24.sp)
                      }
                  }
              ) { p ->
                  Column(modifier = Modifier.padding(p).padding(16.dp)) {
                      Card(modifier = Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.primary), shape = RoundedCornerShape(16.dp)) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text("বর্তমান মোট স্থিতি", color = Color.White.copy(0.8f))
                              Text("৳ ${format(inc.subtract(exp))}", color = Color.White, fontSize = 28.sp, fontWeight = FontWeight.Bold)
                              Spacer(modifier = Modifier.height(10.dp))
                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                  Text("জমা: ৳ ${format(inc)}", color = Color(0xFFA5D6A7))
                                  Text("খরচ: ৳ ${format(exp)}", color = Color(0xFFEF9A9A))
                              }
                          }
                      }
                      Spacer(modifier = Modifier.height(16.dp))
                      Text("লেনদেনের তালিকা", fontWeight = FontWeight.Bold, fontSize = 18.sp)
                      Spacer(modifier = Modifier.height(8.dp))
                      LazyColumn {
                          items(list) { item ->
                              Card(modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp)) {
                                  Row(modifier = Modifier.padding(16.dp).fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                      Text(item.title, fontWeight = FontWeight.SemiBold)
                                      val isExp = item.type == TransactionType.EXPENSE
                                      Text("${if (isExp) "-" else "+"} ৳ ${format(item.amount)}", color = if (isExp) Color.Red else Color(0xFF2E7D32), fontWeight = FontWeight.Bold)
                                  }
                              }
                          }
                      }
                  }
                  if (openDialog) {
                      var t by remember { mutableStateOf("") }
                      var a by remember { mutableStateOf("") }
                      var isExpense by remember { mutableStateOf(true) }
                      AlertDialog(
                          onDismissRequest = { openDialog = false },
                          title = { Text("নতুন হিসাব") },
                          text = {
                              Column {
                                  OutlinedTextField(value = t, onValueChange = { t = it }, label = { Text("বিবরণ (যেমন: বাজার)") })
                                  Spacer(modifier = Modifier.height(8.dp))
                                  OutlinedTextField(value = a, onValueChange = { a = it }, label = { Text("টাকা") })
                                  Spacer(modifier = Modifier.height(8.dp))
                                  Row {
                                      FilterChip(selected = isExpense, onClick = { isExpense = true }, label = { Text("খরচ") })
                                      Spacer(modifier = Modifier.width(8.dp))
                                      FilterChip(selected = !isExpense, onClick = { isExpense = false }, label = { Text("জমা") })
                                  }
                              }
                          },
                          confirmButton = {
                              Button(onClick = {
                                  val am = a.toBigDecimalOrNull() ?: BigDecimal.ZERO
                                  if (t.isNotBlank() && am > BigDecimal.ZERO) {
                                      vm.add(t, am, if (isExpense) TransactionType.EXPENSE else TransactionType.INCOME)
                                      openDialog = false
                                  }
                              }) { Text("যোগ করুন") }
                          }
                      )
                  }
              }
          }
          fun format(b: BigDecimal): String = NumberFormat.getNumberInstance(Locale("bn", "BD")).format(b)
          EOF

      - name: Setup Gradle
        run: gradle wrapper

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HisabBondhu-App
          path: app/build/outputs/apk/debug/app-debug.apk
